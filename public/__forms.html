<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Forms</title><meta name="robots" content="noindex"></head>
<body>
<!-- Netlify Forms skeleton: registers the "contact" form at deploy time.
     Field names must match src/components/client.tsx → ContactForm exactly. -->
<form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
  <input type="hidden" name="form-name" value="contact" />
  <input name="bot-field" />
  <input name="name" />
  <input name="email" type="email" />
  <input name="company" />
  <textarea name="message"></textarea>
</form>
</body></html>
